<ion-content [fullscreen]="true" class="home-content">

  
  <div class="topo">
    <div class="topo-linha">
      <div>
        <p class="data">{{ dataHoje }}</p>
        <h2 class="ola">Olá, Ana</h2>
      </div>
      <img class="avatar" src="https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=100&h=100&fit=crop" alt="Ana">
    </div>

    <div class="stats">
      <div class="stat"><strong>{{ items.length }}</strong><span>Peças</span></div>
      <div class="stat"><strong>4</strong><span>Looks</span></div>
      <div class="stat"><strong>3</strong><span>Favoritos</span></div>
    </div>
  </div>

  <div class="corpo">


    <div class="acoes-rapidas">
      <button class="acao" (click)="addItem()">
        <ion-icon name="add-outline"></ion-icon>
        <span>Adicionar peça</span>
      </button>
      <button class="acao" (click)="irPara('/tabs/tab3')">
        <ion-icon name="sparkles-outline"></ion-icon>
        <span>Gerar look</span>
      </button>
      <button class="acao" (click)="irPara('/calendario')">
        <ion-icon name="calendar-outline"></ion-icon>
        <span>Calendário</span>
      </button>
    </div>

    
    <div class="look-dia">
      <img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=800&h=400&fit=crop" alt="Look do dia">
      <div class="look-overlay">
        <div class="look-texto">
          <span class="tag-ia">IA</span>
          <p>Look do dia — Minimalista Clean</p>
        </div>
        <button class="btn-ver" (click)="irPara('/tabs/tab3')">Ver</button>
      </div>
    </div>


    <p class="titulo-secao">Categorias</p>
    <div class="categorias">
      <button class="categoria" *ngFor="let cat of categorias" (click)="irPara('/tabs/tab3')">
        <ion-icon [name]="cat.icone"></ion-icon>
        <span>{{ cat.nome }}</span>
      </button>
    </div>

    
    <button class="aviso-sem-uso">
      <span class="emoji">⏰</span>
      <div class="aviso-texto">
        <strong>3 peças sem uso há +30 dias</strong>
        <small>Toque para criar looks com elas</small>
      </div>
      <ion-icon name="chevron-forward-outline"></ion-icon>
    </button>


    <button class="btn-chat" (click)="irPara('/chat')">
      <ion-icon name="chatbubble-outline"></ion-icon>
      Chat com IA — descreva seu look
    </button>

  </div>
</ion-content>
